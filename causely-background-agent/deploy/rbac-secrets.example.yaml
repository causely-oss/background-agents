# Opt-in, namespace-scoped Secret access for kubectl_get_secret_keys.
#
# Deliberately kept in its own file, applied by a SEPARATE, deliberate
# `kubectl apply -f deploy/rbac-secrets.example.yaml` — putting this in
# rbac.yaml itself, even at the bottom with an "opt-in" comment, meant
# `kubectl apply -f deploy/rbac.yaml` (as documented in README.md) applied it
# by default regardless of intent, since kubectl applies every document in a
# multi-doc YAML file. A comment doesn't stop that; a separate file does.
#
# Grants "get"/"list" on Secret objects — but the tool layer only ever
# returns a Secret's key names, never its decoded values (see
# kubeClient.GetSecretKeys in kube.go). That's a code-level filter, not an
# RBAC boundary: RBAC has no way to grant access to a Secret's metadata/keys
# without also granting its data, so anyone who applies this is granting real
# read access to Secret contents in the target namespace, and is trusting
# this agent's own code (not RBAC) to keep the decoded values out of Claude's
# context. Copy/edit the namespace below per namespace you want to opt in —
# never cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: causely-background-agent-secrets
  namespace: causely # change to the one namespace you're opting in
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: causely-background-agent-secrets
  namespace: causely # must match the Role's namespace above
subjects:
  - kind: ServiceAccount
    name: causely-background-agent
    namespace: causely-mediation # must match the ServiceAccount's namespace in rbac.yaml
roleRef:
  kind: Role
  name: causely-background-agent-secrets
  apiGroup: rbac.authorization.k8s.io
