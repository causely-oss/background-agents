# Causely Generic Webhook -> AWS DevOps Agent relay.
#
# Apply into the cluster running Causely:
#   kubectl apply -f examples/causely-notification-secret.yaml
#
# Equivalent to configuring Settings -> Notifications in the Causely UI (type
# Generic). Use whichever you prefer; the UI is simpler, this is reproducible.
#
# Take current values from .state/relay-endpoint and .state/causely-notif-token.
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: devops-agent-notification-config
  namespace: causely
  labels:
    causely.ai/notif-config: Generic
stringData:
  notif_config_type: Generic
  notif_config_name: aws-devops-agent

  notif_config_url: https://<relay-api-id>.execute-api.<region>.amazonaws.com

  # Sent verbatim as the Authorization header, so the scheme must be included here.
  notif_config_token: "Bearer <token from .state/causely-notif-token>"

  notif_config_global: "false"

  # Every notification starts an investigation, and investigations bill by
  # agent-second. Restricting to Critical/High keeps a noisy afternoon of
  # low-severity diagnoses from becoming a noisy AWS bill.
  notif_config_filters_enabled: "true"
  notif_config_filters: |
    [{"field": "severity", "operator": "in", "value": ["Critical", "High"]}]
